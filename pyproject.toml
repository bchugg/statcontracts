[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statcontracts"
dynamic = ["version"]
description = "Statistical contracts: e-value based mechanisms for principal-agent hypothesis testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ben Chugg" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.2",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.hatch.version]
path = "src/statcontracts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/statcontracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running checks (deselect with -m 'not slow')"]
